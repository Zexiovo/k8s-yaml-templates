apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-publish
spec:
  template:
    spec:
      containers:
      - name: rabbitmq-client
        image: registry.cn-beijing.aliyuncs.com/dotbalo/rabbitmq-publish:v1.0
        imagePullPolicy: IfNotPresent
        command:
          [
           "send",
           "amqp://user:password@rabbitmq.default.svc.cluster.local:5672",
           "500",
          ]
      restartPolicy: Never
  backoffLimit: 4

