apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: memory-consumer
  name: memory-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-consumer
  strategy: {}
  template:
    metadata:
      labels:
        app: memory-consumer
    spec:
      containers:
      - image: registry.cn-beijing.aliyuncs.com/dotbalo/stress:latest
        name: stress
        args:
        - stress
        - --vm
        - "1"
        - --vm-bytes
        - "64M"
        - --verbose
        - --vm-hang
        - "3600"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
status: {}
